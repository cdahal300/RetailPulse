name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  infra:
    name: IaC and manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-kubectl@v4
      - name: Build Bicep template
        uses: azure/cli@v2
        with:
          inlineScript: |
            az bicep build --file infra/environments/main.bicep
      - name: Render Kubernetes overlays
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kustomize"
          for overlay in dev staging prod; do
            kubectl kustomize "infra/kubernetes/overlays/${overlay}" > "$RUNNER_TEMP/kustomize/${overlay}.yaml"
          done
      - name: Check manifests do not contain inline secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -R "kind: Secret\|Password=CHANGEME" infra/kubernetes "$RUNNER_TEMP/kustomize"; then
            echo "Kubernetes manifests must not contain inline secrets or placeholder passwords."
            exit 1
          fi

  dotnet:
    name: .NET build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore RetailPulse.sln
      - name: Build
        run: dotnet build RetailPulse.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test RetailPulse.sln --no-build --configuration Release --logger trx --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: TestResults
          if-no-files-found: ignore

  pwa:
    name: PWA build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Web/RetailPulse.Portal
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Web/RetailPulse.Portal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
