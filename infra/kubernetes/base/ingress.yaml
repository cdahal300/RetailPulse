# Ingress for Cloud API
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: retailpulse-ingress
  namespace: retailpulse
  annotations:
    kubernetes.io/ingress.class: "azure/application-gateway"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  labels:
    app: retailpulse
spec:
  tls:
  - hosts:
    - api.retailpulse.example.com
    secretName: retailpulse-tls-cert
  rules:
  - host: api.retailpulse.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: cloud-api
            port:
              number: 5000
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: cloud-api
            port:
              number: 5000
