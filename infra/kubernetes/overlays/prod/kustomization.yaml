apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: retailpulse

bases:
  - ../../base

# Environment-specific ConfigMap values
configMapGenerator:
  - name: retailpulse-config
    behavior: merge
    literals:
      - ASPNETCORE_ENVIRONMENT=Production

# Environment-specific image tags
images:
  - name: retailpulse-cloud
    newName: retailpulse-cloudcontainerregistry.azurecr.io/retailpulse-cloud
    newTag: prod  # Must be a specific version, never 'latest'
  - name: retailpulse-edge
    newName: retailpulse-cloudcontainerregistry.azurecr.io/retailpulse-edge
    newTag: prod

# Common labels
commonLabels:
  environment: prod
  version: v1

# Patches for production environment
patches:
  # Production replicas and autoscaling
  - target:
      kind: HorizontalPodAutoscaler
      name: cloud-api-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 10
      - op: replace
        path: /spec/metrics/0/resource/target/averageUtilization
        value: 60
  - target:
      kind: HorizontalPodAutoscaler
      name: edge-api-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 8
      - op: replace
        path: /spec/metrics/0/resource/target/averageUtilization
        value: 60
  # Production resource allocations
  - target:
      kind: Deployment
      name: cloud-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "250m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
  - target:
      kind: Deployment
      name: edge-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "250m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
  # Production pod disruption budgets
  - target:
      kind: Deployment
      name: cloud-api
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations/podDisruptionBudget
        value: "minAvailable: 2"
  - target:
      kind: Deployment
      name: edge-api
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations/podDisruptionBudget
        value: "minAvailable: 2"

# Production-specific resources
resources:
  - pod-disruption-budget.yaml
  - network-policy-strict.yaml
