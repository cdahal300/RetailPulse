apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: retailpulse

resources:
  - ../../base

# Environment-specific image tags
images:
  - name: REGISTRY_URL/retailpulse-cloud
    newName: retailpulse-cloudcontainerregistry.azurecr.io/retailpulse-cloud
    newTag: staging
  - name: REGISTRY_URL/retailpulse-edge
    newName: retailpulse-cloudcontainerregistry.azurecr.io/retailpulse-edge
    newTag: staging

# Common labels
labels:
  - pairs:
      environment: staging
      version: v1

# Patches for staging environment
patches:
  # Staging runtime settings
  - target:
      kind: ConfigMap
      name: retailpulse-config
    patch: |-
      - op: replace
        path: /data/ASPNETCORE_ENVIRONMENT
        value: Staging
  # Standard replicas for staging
  - target:
      kind: HorizontalPodAutoscaler
      name: cloud-api-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 5
  - target:
      kind: HorizontalPodAutoscaler
      name: edge-api-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 5
  # Standard resource allocations for staging
  - target:
      kind: Deployment
      name: cloud-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"
  - target:
      kind: Deployment
      name: edge-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"
